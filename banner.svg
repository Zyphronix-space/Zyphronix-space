<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset="1" stop-color="#181229"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="75"/>
    </filter>
    <linearGradient id="titleFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d4f0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="28" fill="url(#bg)"/>
  <circle cx="1000" cy="40" r="180" fill="#6c5ce7" opacity="0.40" filter="url(#blur1)"/>
  <circle cx="110" cy="250" r="160" fill="#9b59f6" opacity="0.22" filter="url(#blur2)"/>
  <rect x="1" y="1" width="1198" height="278" rx="28" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="76" font-weight="700" fill="url(#titleFade)" letter-spacing="4">STEPHAN</text>
  <text x="600" y="185" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="24" font-weight="400" fill="#aca6c9" letter-spacing="1">Full-Stack Developer &#8226; AI/ML Enthusiast</text>
</svg>
